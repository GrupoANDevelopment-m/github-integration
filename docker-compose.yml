# Goodware v3.0 — docker-compose.yml
# Stacks: api, federated-server, monitoring (Prometheus + Grafana)

version: "3.9"

services:
  goodware-api:
    build: .
    container_name: goodware-api
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GOODWARE_NODE_ID=node-1
      - GOODWARE_LOG_LEVEL=INFO
    volumes:
      - goodware-data:/var/lib/goodware
      - goodware-logs:/var/log/goodware
      - /var/lib/clamav:/var/lib/clamav:ro
      - /sys/fs/tee:/sys/fs/tee:ro
    networks:
      - goodware-net
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  federated-server:
    build: .
    container_name: goodware-federated
    restart: unless-stopped
    command: ["federated"]
    ports:
      - "8444:8444"
    environment:
      - GOODWARE_NODE_ID=federated-server
    volumes:
      - goodware-data:/var/lib/goodware
    networks:
      - goodware-net

  prometheus:
    image: prom/prometheus:latest
    container_name: goodware-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - goodware-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:latest
    container_name: goodware-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-goodware}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - goodware-net

volumes:
  goodware-data:
  goodware-logs:
  prometheus-data:
  grafana-data:

networks:
  goodware-net:
    driver: bridge
