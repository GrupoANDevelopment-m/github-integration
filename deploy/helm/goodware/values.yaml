replicaCount: 1

image:
  repository: goodware/goodware-v3
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8443

persistence:
  enabled: true
  size: 50Gi
  storageClass: ""

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

env:
  DEEPSEEK_API_KEY: ""
  NVIDIA_API_KEY: ""

monitoring:
  prometheus:
    enabled: true
    port: 9090
