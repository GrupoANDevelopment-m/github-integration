# Prometheus configuration for Goodware v3.0
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'goodware-api'
    metrics_path: '/api/llm/telemetry/prometheus'
    static_configs:
      - targets: ['goodware-api:8443']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
