name: CI/CD Pipeline

# Avoid expensive duplicate liboqs builds when several commits are pushed to one PR.
concurrency:
  group: goodware-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            yara libyara-dev clamav tpm2-tools nftables iptables \
            build-essential cmake ninja-build git
      
      - name: Build liboqs
        run: |
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs && mkdir build && cd build
          cmake -GNinja -DOQS_BUILD_ONLY_LIB=ON -DBUILD_SHARED_LIBS=ON ..
          sudo ninja install && sudo ldconfig
      
      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          PYTHONPATH: ${{ github.workspace }}
        run: |
          chmod +x scripts/test_all.sh
          ./scripts/test_all.sh
      
      - name: Train models with NSL-KDD
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git clone --depth 1 https://github.com/Jehuty4949/NSL_KDD.git
          python3 -m goodware.prediction.training.train_nsl_kdd \
            --train NSL_KDD/KDDTrain+.txt \
            --test NSL_KDD/KDDTest+.txt \
            --output models/

      - name: Real ML inference regression (no synthetic fallback)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m unittest tests.test_model_runtime -v

      - name: Build Docker image
        run: docker build -t goodware-v3:${{ github.sha }} .
      
      - name: Docker runtime smoke (health + API auth)
        env:
          GOODWARE_API_TOKEN: ci-smoke-token
        run: |
          set -euo pipefail
          IMAGE="goodware-v3:${{ github.sha }}"
          CONTAINER="goodware-smoke-${{ github.run_id }}"
          cleanup() {
            docker logs "$CONTAINER" 2>/dev/null | tail -n 120 || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$CONTAINER" \
            -e GOODWARE_API_TOKEN="$GOODWARE_API_TOKEN" \
            -p 127.0.0.1:18443:8443 "$IMAGE"
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18443/api/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container did not become healthy in 120 seconds"
            exit 1
          fi
          unauthorized="$(curl --silent --output /tmp/goodware-unauth.json --write-out '%{http_code}' http://127.0.0.1:18443/api/status)"
          test "$unauthorized" = "401"
          authorized="$(curl --silent --output /tmp/goodware-auth.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GOODWARE_API_TOKEN" \
            http://127.0.0.1:18443/api/status)"
          test "$authorized" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path("/tmp/goodware-auth.json").read_text())
          assert "engine" in body and isinstance(body["engine"], dict), body
          print("Docker runtime smoke passed: health=200, unauthenticated status=401, authenticated status=200")
          PY
          docker exec "$CONTAINER" python3 -c 'from goodware.core.config import GoodwareConfig; from goodware.prediction.threat_predictor import ThreatPredictor; p=ThreatPredictor("ci-runtime-model-check", GoodwareConfig.load()); assert p.model_loaded, f"runtime model unavailable: {p.model_source}"; assert p.model_source in {"unsw_nb15", "nsl_kdd", "legacy"}; assert not p.synthetic_fallback; print(f"runtime model loaded: {p.model_source}, features={p.feature_count}, anomaly_loaded={p.anomaly_loaded}")'

      - name: Push to registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
          docker tag goodware-v3:${{ github.sha }} ${{ secrets.DOCKER_USER }}/goodware-v3:latest
          docker push ${{ secrets.DOCKER_USER }}/goodware-v3:latest
